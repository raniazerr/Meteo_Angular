<form #searchForm="ngForm" (ngSubmit)="rechercher()" class="search-bar">
    <div class="search-ville">
        <input 
            type="text" 
            name="ville"
            [(ngModel)]="nomVille" 
            required
            #villeInput="ngModel"
            placeholder="Rechercher une ville...">
        <button type="submit">🔍</button>
    </div>
</form>
<button type="button" (click)="localiser()" [disabled]="chargement">
    <span *ngIf="!chargement">📍 Ma position</span>
    <span *ngIf="chargement" class="spinner"></span>
</button>
<div *ngIf="erreurVille" class="erreur-message">
    ⚠️ {{ erreurVille }}
</div>
